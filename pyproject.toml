[project]
name = "mandera-countylens"
version = "0.1.0"
description = "Q&A and analysis over Mandera County budgets and plans, with year-aware citations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-chroma>=0.6.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]
